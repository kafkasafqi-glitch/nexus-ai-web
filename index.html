<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 650px;
      background: #151c30;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #293550;
    }
    h1 { color: #70a5ff; margin-top: 0; }
    #chat {
      height: 380px;
      overflow-y: auto;
      background: #0b1020;
      border-radius: 12px;
      padding: 15px;
      margin: 20px 0;
    }
    .msg { margin-bottom: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { color: #80b5ff; }
    .ai { color: #b9c7df; }
    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #33415e;
      background: #0b1020;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #3978f6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    button:hover:not(:disabled) { background: #5590ff; }
  </style>
</head>
<body>
  <div class="app">
    <h1>✦ NEXUS AI</h1>
    <p>Asisten AI pribadi lu.</p>
    <div id="chat" aria-live="polite">
      <div class="msg ai">NEXUS AI: Halo! Gue NEXUS AI. Ada yang bisa gue bantu?</div>
    </div>
    <input id="prompt" placeholder="Tulis pesan..." autocomplete="off" />
    <button id="sendButton" onclick="send()">Kirim</button>
  </div>

  <script>
    const API_URL = 'https://nexus-ai-api.kafkasafqi.workers.dev/api/chat';
    const messages = [];
    const input = document.getElementById('prompt');
    const chat = document.getElementById('chat');
    const sendButton = document.getElementById('sendButton');

    function addMessage(label, text, className) {
      const item = document.createElement('div');
      item.className = 'msg ' + className;
      item.textContent = label + ': ' + text;
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
      return item;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sendButton.disabled) return;

      addMessage('Lu', text, 'user');
      messages.push({ role: 'user', content: text });
      input.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'NEXUS AI sedang mengetik...';
      const loading = addMessage('NEXUS AI', 'Sedang berpikir...', 'ai');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Permintaan gagal (' + response.status + ')');
        }
        if (typeof data.reply !== 'string' || !data.reply.trim()) {
          throw new Error('Server tidak mengirim jawaban yang valid.');
        }

        loading.textContent = 'NEXUS AI: ' + data.reply;
        messages.push({ role: 'assistant', content: data.reply });
      } catch (error) {
        loading.textContent = 'NEXUS AI: Maaf bro, ada kendala menghubungi server. ' + error.message;
        messages.pop();
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Kirim';
        chat.scrollTop = chat.scrollHeight;
        input.focus();
      }
    }

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') send();
    });
  </script>
</body>
</html>
